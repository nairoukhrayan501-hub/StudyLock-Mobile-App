kind = "mobile"
previewPath = "/"
title = "StudyLock"
description = "A bilingual Arabic-English study planner for students to organize subjects, sessions, tasks, and offline focus timers."
version = "1.0.0"
id = "artifacts/studylock"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25011

[services.development]
run = "pnpm --filter @workspace/studylock run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studylock", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/studylock", "run", "serve" ]

[services.env]
PORT = "25011"
BASE_PATH = "/"
